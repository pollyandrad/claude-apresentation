<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:2000px;background:#2e211a;font-family:Georgia;color:#e8e2d6;padding:40px 0 60px}
h2{font-weight:400;text-align:center;font-size:34px;letter-spacing:.16em;margin:30px 0 8px}
p{text-align:center;font-size:20px;opacity:.75;margin:0 0 26px;font-style:italic}
.row{display:flex;gap:40px;justify-content:center;align-items:center}
.card{width:340px;height:500px;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.card iframe{width:401px;height:590px;border:0;position:absolute;left:-10.2px;top:-10.2px;transform:scale(.897);transform-origin:0 0;}
.tela{width:1000px;height:562.5px;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.tela iframe{width:1920px;height:1080px;border:0;transform:scale(.5208);transform-origin:0 0}
.logo{position:absolute;opacity:.12;pointer-events:none}
.logo img{width:100%;display:block}
</style></head><body>
<h2>OPÇÃO A · A LOGO SUBSTITUI A PALAVRA</h2>
<p>uma única marca grande ao fundo</p>
<div class="row">
  <div class="card"><iframe src="cartao-dinamica/cartao.html?lado=frente&semmarca=1"></iframe><div class="logo" style="width:330px;right:-90px;top:200px"><img src="logo/marcador-logo.svg"></div></div>
  <div class="tela"><iframe src="telas-projecao/telas.html?n=7&semmarca=1"></iframe><div class="logo" style="width:470px;right:-60px;top:60px"><img src="logo/marcador-logo.svg"></div></div>
</div>
<h2>OPÇÃO B · LOGO E PALAVRA JUNTAS</h2>
<p>a palavra continua embaixo; a logo ocupa o espaço vazio de cima</p>
<div class="row">
  <div class="card"><iframe src="cartao-dinamica/cartao.html?lado=frente"></iframe><div class="logo" style="width:190px;right:-45px;top:-95px"><img src="logo/marcador-logo.svg"></div></div>
  <div class="tela"><iframe src="telas-projecao/telas.html?n=7"></iframe><div class="logo" style="width:300px;right:40px;top:-150px"><img src="logo/marcador-logo.svg"></div></div>
</div>
</body></html>
