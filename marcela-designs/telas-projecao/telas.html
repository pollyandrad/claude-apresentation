<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telas de projeção · CAISA DAY 2026</title>
<style>
/*
  Kit de telas de projeção · 1920 × 1080 (16:9).
  Paleta Marcela, Instrument Serif + Poppins (linha de detalhe), textura de papel.
  Área segura: 140 px nas laterais, 110 px em cima e embaixo.
  Parâmetros: ?n=1..10 (uma tela) · ?semtexto=1 (só o fundo, para o PPTX) · sem ?n = todas.
*/
@font-face{font-family:"IS";src:url("../fonts/InstrumentSerif-Regular.ttf");font-style:normal}
@font-face{font-family:"IS";src:url("../fonts/InstrumentSerif-Italic.ttf");font-style:italic}
@font-face{font-family:"Pop";src:url("../fonts/Poppins-Regular.ttf")}
:root{--musgo:#374325;--oliva:#486125;--claro:#BAD986;--off:#F6F6F2}
@page{size:1920px 1080px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:"IS",Georgia,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tela{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--musgo) url("fundo/textura.jpg") center/cover;color:var(--off);break-after:page}
.tela:last-child{break-after:auto}
.marca{position:absolute;font-style:italic;line-height:1;white-space:nowrap;color:var(--claro);opacity:.12;pointer-events:none}
.semtexto .t{visibility:hidden}

.topo{position:absolute;left:140px;right:140px;top:110px;display:flex;justify-content:space-between;align-items:baseline}
.evento{font-size:24px;letter-spacing:.32em;text-transform:uppercase;color:var(--claro)}
.pilares{font-style:italic;font-size:30px;color:var(--off)}
.base{position:absolute;left:140px;right:140px;bottom:110px;display:flex;justify-content:space-between;align-items:baseline}
.base .t{font-family:"Pop",Helvetica,Arial,sans-serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--off)}
.base .t.i{font-family:"IS",Georgia,serif;font-style:italic;font-size:28px;letter-spacing:0;text-transform:none;color:var(--claro)}

.miolo{position:absolute;left:140px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:34px;max-width:1300px}
.olho{font-style:italic;font-size:40px;color:var(--claro)}
.titulo{font-size:150px;line-height:.98;letter-spacing:-.005em}
.titulo em,.sub em{color:var(--claro)}
.fio{width:90px;height:0;border-top:2px solid var(--claro)}
.sub{font-style:italic;font-size:60px;line-height:1.08;color:var(--claro)}
.sub.claro{font-style:normal;color:var(--off);font-size:52px}
.citacao{font-size:100px;line-height:1.04;max-width:1500px}

.foto{position:absolute;right:140px;top:170px;width:620px;height:740px;border:2px dashed rgba(186,217,134,.55);display:grid;place-items:center;font-family:"Pop",Helvetica,Arial,sans-serif;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:rgba(186,217,134,.8);text-align:center;line-height:1.8}
.marcador{border-bottom:2px dashed rgba(186,217,134,.55);padding-bottom:6px}
.semmarca .marca{display:none}
.logo-fundo{position:absolute;width:900px;right:-120px;top:110px;opacity:.12;pointer-events:none}

/* ---- variações de composição ---- */
.miolo.centro{left:50%;transform:translate(-50%,-50%);align-items:center;text-align:center;width:1640px;max-width:1640px}
.miolo.direita{left:auto;right:140px;align-items:flex-end;text-align:right}
.miolo.baixo{top:auto;bottom:200px;transform:none}
.logo-centro{position:absolute;left:50%;top:50%;height:960px;transform:translate(-50%,-50%);opacity:.08;pointer-events:none}
.logo-selo{width:150px;opacity:.9}
.oval{position:absolute;left:50%;top:50%;width:820px;height:940px;transform:translate(-50%,-50%);border:2px solid rgba(186,217,134,.45);border-radius:50%}
.oval::after{content:"";position:absolute;inset:18px;border:1px solid rgba(186,217,134,.25);border-radius:50%}
.aspas{position:absolute;left:110px;top:40px;font-size:900px;line-height:1;color:var(--claro);opacity:.14;font-style:italic}
.foto-esq{position:absolute;left:0;top:0;bottom:0;width:760px;border-right:2px dashed rgba(186,217,134,.55);display:grid;place-items:center;font-family:"Pop",Helvetica,Arial,sans-serif;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:rgba(186,217,134,.8);text-align:center;line-height:1.8;background:rgba(0,0,0,.12)}
.pequeno{font-size:64px;line-height:1.1}
</style>
</head>
<body>
<div id="telas"></div>
<script>
const BASE = '<div class="base"><span class="t">20</span><span class="t i">de</span><span class="t">novembro</span><span class="t i">de</span><span class="t">2026</span><span class="t i">em</span><span class="t">Recife</span></div>';
const TOPO = (pilares=true) => `<div class="topo"><span class="t evento">Caisa Day 2026</span>${pilares ? '<span class="t pilares">Clínica • Carreira • Essência</span>' : ''}</div>`;
const LOGO_C = '<img class="logo-centro" src="../logo/caisa-logo-releitura_verde-claro.svg" alt="" aria-hidden="true">';
const SELO = '<img class="logo-selo" src="../logo/caisa-logo-releitura_verde-claro.svg" alt="">';
const M = (txt, css) => `<div class="marca" style="${css}">${txt}</div>`;

// Cada tela tem uma composição própria; a logo só aparece nos momentos institucionais (01, 04, 10).
const TELAS = [
  {n:1, nome:'recepcao', html: LOGO_C + TOPO() +
    `<div class="miolo centro"><h1 class="t titulo" style="font-size:240px">Bem-<em>vindas.</em></h1></div>` + BASE},
  {n:2, nome:'abertura-oficial', html: TOPO() + '<div class="aspas">“</div>' +
    `<div class="miolo centro" style="max-width:1560px"><p class="t citacao" style="font-size:92px">Toda transformação profissional<br>começa antes da ação:</p><div class="fio"></div><p class="t sub" style="font-size:84px">começa na forma como você pensa.</p></div>` + BASE},
  {n:3, nome:'convidada', html: '<div class="foto-esq"><span class="t">Foto real<br>da convidada</span></div>' +
    `<div class="miolo" style="left:900px;max-width:880px"><p class="t olho">Convidada</p><h1 class="t titulo" style="font-size:124px">Nome da<br>convidada</h1><div class="fio"></div><p class="t sub">Título da apresentação</p></div>` +
    `<div class="topo" style="left:900px"><span class="t evento">Caisa Day 2026</span></div>`},
  {n:4, nome:'transicao', html:
    `<div class="miolo centro">${SELO}<h1 class="t titulo" style="font-size:170px;margin-top:20px">Caisa Day 2026</h1><div class="fio"></div><p class="t sub">Clínica • Carreira • Essência</p></div>` + BASE},
  {n:5, nome:'reflexao-marcela', html: TOPO() + M('movimento','left:-40px;top:560px;font-size:430px') +
    `<div class="miolo"><h1 class="t titulo">Da consciência<br>ao <em>movimento</em></h1><div class="fio"></div><p class="t sub claro">Dra. Marcela Oliveira</p></div>` + BASE},
  {n:6, nome:'roda-de-conversa', html: TOPO() +
    `<div class="miolo direita"><p class="t olho">Roda de conversa</p><h1 class="t titulo" style="font-size:170px">Trajetórias,<br>escolhas<br>e <em>possibilidades.</em></h1></div>` + BASE},
  {n:7, nome:'dinamica-final', html: '<div class="oval"></div>' +
    `<div class="miolo centro"><p class="t olho">Caisa Day 2026</p><h1 class="t titulo" style="font-size:120px">Um momento<br>para <em>você.</em></h1></div>`},
  {n:8, nome:'momento-do-pin', html: TOPO(false) +
    `<div class="miolo baixo"><h1 class="t titulo" style="font-size:150px">Caisa Day 2026</h1><div class="fio"></div><p class="t sub marcador">[Texto simbólico a ser aprovado pela organizadora]</p></div>`},
  {n:9, nome:'encerramento', html: TOPO() +
    `<div class="miolo"><p class="t sub claro pequeno">Não é sair fazendo mais.</p><h1 class="t titulo" style="font-size:200px;color:var(--claro);font-style:italic">É sair escolhendo melhor.</h1></div>` + BASE},
  {n:10, nome:'agradecimento', html: LOGO_C +
    `<div class="miolo centro"><h1 class="t titulo" style="font-size:150px">Obrigada por fazer<br>parte desta <em>história.</em></h1><div class="fio"></div><p class="t sub">Caisa Day 2026</p></div>` + BASE},
];

const q = new URLSearchParams(location.search);
const n = +q.get('n');
const lista = n ? TELAS.filter(t => t.n === n) : TELAS;
document.getElementById('telas').innerHTML = lista.map(t => `<section class="tela" id="tela-${t.n}" data-nome="${t.nome}">${t.html}</section>`).join('');
if (q.get('semtexto')) document.body.classList.add('semtexto');
if (q.get('semmarca')) document.body.classList.add('semmarca');
window.TELAS = TELAS.map(({n, nome}) => ({n, nome}));
</script>
</body>
</html>
